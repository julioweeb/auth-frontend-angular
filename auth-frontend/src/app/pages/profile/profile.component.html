<nav class="dashboard-nav">
  <h1>Meu Perfil</h1>
  <div style="display:flex; gap: 1rem; align-items: center;">
    <a routerLink="/dashboard" style="font-size: 0.9rem;">← Voltar ao Dashboard</a>
    <button (click)="logout()">Sair</button>
  </div>
</nav>

<div class="dashboard-content">

  <!-- Informações Atuais -->
  <div class="glass-panel info-card" *ngIf="user">
    <div class="info-item">
      <span class="info-label">Nome Atual</span>
      <span class="info-value">{{ user.name }}</span>
    </div>
    <div class="info-item" style="margin-bottom:0">
      <span class="info-label">Email</span>
      <span class="info-value">{{ user.email }}</span>
    </div>
  </div>

  <!-- Formulário: Atualizar Nome -->
  <div class="glass-panel info-card">
    <h2 style="text-align:left; font-size:1.3rem; margin-bottom: 1.2rem;">Atualizar Nome</h2>

    <form (ngSubmit)="updateProfile()" #profileForm="ngForm">
      <input
        type="text"
        placeholder="Novo nome"
        [(ngModel)]="name"
        name="name"
        required
        minlength="2"
      />
      <button type="submit" [disabled]="profileForm.invalid || profileLoading">
        {{ profileLoading ? 'Salvando...' : 'Salvar Nome' }}
      </button>
    </form>

    <p class="text-success" *ngIf="profileSuccess">{{ profileSuccess }}</p>
    <p class="text-danger" *ngIf="profileError">{{ profileError }}</p>
  </div>

  <!-- Formulário: Trocar Senha -->
  <div class="glass-panel info-card">
    <h2 style="text-align:left; font-size:1.3rem; margin-bottom: 1.2rem;">Trocar Senha</h2>

    <form (ngSubmit)="updatePassword()" #passwordForm="ngForm">
      <div class="password-wrapper">
        <input
          [type]="showCurrentPassword ? 'text' : 'password'"
          placeholder="Senha atual"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          required
        />
        <button type="button" class="password-toggle-btn" (click)="showCurrentPassword = !showCurrentPassword">
          <svg *ngIf="!showCurrentPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          <svg *ngIf="showCurrentPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <div class="password-wrapper">
        <input
          [type]="showNewPassword ? 'text' : 'password'"
          placeholder="Nova senha (mín. 6 caracteres)"
          [(ngModel)]="newPassword"
          name="newPassword"
          required
          minlength="6"
        />
        <button type="button" class="password-toggle-btn" (click)="showNewPassword = !showNewPassword">
          <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
          </svg>
          <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <button type="submit" [disabled]="passwordForm.invalid || passwordLoading">
        {{ passwordLoading ? 'Alterando...' : 'Alterar Senha' }}
      </button>
    </form>

    <p class="text-success" *ngIf="passwordSuccess">{{ passwordSuccess }}</p>
    <p class="text-danger" *ngIf="passwordError">{{ passwordError }}</p>
  </div>

</div>
